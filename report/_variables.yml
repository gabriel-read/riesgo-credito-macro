  no_i0: π y CRED(t−4)
  limitaciones:
  - 'Endogeneidad de la tasa de fondos federales: La Fed reacciona a la economía:
    ΔFFR se asocia con la morosidad, pero esa asociación no identifica el efecto de
    la política monetaria.'
  - 'Simultaneidad de los regresores contemporáneos: PIB, desempleo, inflación y ΔFFR
    se determinan junto con la morosidad del mismo trimestre: los coeficientes son
    asociaciones condicionales, no efectos aislados.'
  - 'Potencia baja de Diebold-Mariano: La evaluación fuera de muestra tiene pocos
    trimestres, por lo que la prueba de Diebold-Mariano tiene poca potencia.'
  - 'Efectos base de 2021T2–2022T1 sin dummy: El rebote interanual del PIB y el crecimiento
    del crédito asociado al programa PPP, que entra en CRED(t−4) entre 2021T2 y 2022T1,
    no llevan dummy; la robustez R1 (sin 2020–2021) sirve de contraste.'
  - 'Regresores no I(0): π, CRED(t−4): no son I(0) según la regla de la spec 001;
    entran en su forma fija y su no estacionariedad residual se declara como limitación
    del modelo.'
  - 'Dependientes con orden «posible I(2)»: drsreacbs (R3_drsreacbs), dralacbs_logit
    (R5)'
  - 'Breusch-Pagan: falla: estadístico 21,981, p = 0,015; se reporta y se discute
    qué implica para las conclusiones'
  - 'White: falla: estadístico 91,756, p < 0,001; se reporta y se discute qué implica
    para las conclusiones'
  - 'Jarque-Bera: falla: estadístico 461,908, p < 0,001; se reporta y se discute qué
    implica para las conclusiones'
  - 'RESET: falla: estadístico 6,021, p = 0,003; se reporta y se discute qué implica
    para las conclusiones'
  - 'VIF (d_unemp): alerta: estadístico 36,811; con las dummies COVID dentro de X,
    casi toda la varianza de ΔU es el salto de 2020T2, que su dummy absorbe: no es
    colinealidad entre regresores macro, sino que el coeficiente de ΔU se identifica
    con la variación fuera de la COVID; se reporta y no se elimina ningún regresor'
  - 'Chow 2008T3: falla: estadístico 24,987, p < 0,001; Wald HAC con interacciones
    de la constante, ρ y β₁–β₅; dummies COVID sin interactuar'
  - 'Chow 2020T2: falla: estadístico 15,155, p = 0,034; Wald HAC con interacciones
    de la constante, ρ y β₁–β₅; dummies COVID sin interactuar; quedan 21 trimestres
    posteriores útiles para 7 restricciones: el tamaño empírico del contraste puede
    diferir del 5 % nominal'
  - 'Variante R8 no estimada: sin historia anterior a 2000T1'
  desviaciones:
  - 'PIB real (GDPC1) como regresor principal en lugar del GDP nominal (Guía, secciones
    3.3 y 11): Evita la doble contabilidad con la inflación; el GDP nominal de la
    guía queda como robustez R4.'
  - 'Muestra hasta 2026T2 (último trimestre común) (Guía, sección 11): El ejemplo
    de descarga de la guía corta en 2026-01-01; se usan todos los trimestres completos
    disponibles.'
  - 'Muestra larga desde 1985T1 (fuera del período 2000–2026 de la guía) (Guía, sección
    11): R8 no estimada: sin historia anterior a 2000T1'
  - 'Regresores con forma fija en lugar de la regla de estacionariedad para todas
    las series (Skill de econometría de series de tiempo): Conservan su interpretación
    económica (tasas de variación); su no estacionariedad residual se declara como
    limitación.'
  - 'ΔFFR como variable única de tasas para las secciones 3.3 y 3.4 (Guía, secciones
    3.3 y 3.4): La guía lista la tasa de interés entre las variables macro (3.3) y,
    aparte, el cambio de la FFR como variable de política monetaria (3.4); el Modelo
    I usa una sola.'
  - '2026-10-05 · C1: la DE de los efectos «por 1 DE» excluye 2020T2–2021T1 (Pre-registro
    de la spec 003): Con esos trimestres la DE quedaría dominada por el salto atípico
    de 2020T2, que el modelo ya neutraliza con sus dummies.'
  - '2026-10-05 · C2: los efectos base de 2021T2–2022T1 se declaran como limitación
    fija, con R1 como contraste y sin nuevas dummies (Pre-registro de la spec 003):
    Son puntos de alto apalancamiento que la ventana COVID no cubre.'
  - '2026-10-05 · C3: la comprobación de matriz no definida positiva se acota al sub-bloque
    sin dummies de impulso (Pre-registro de la spec 003): La reducción de rango por
    esas dummies es una propiedad algebraica (residuo nulo), no un fallo numérico.'
