[project]
name = "riesgo-credito-macro"
version = "0.1.0"
description = "Condiciones macroeconómicas, política monetaria y riesgo de crédito: evidencia empírica y análisis de escenarios"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=2.1,<2.2",
    "statsmodels>=0.14",
    "pandas-datareader>=0.11",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "requests>=2.31",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["."]
